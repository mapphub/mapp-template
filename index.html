<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Hello Mapphub</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <main class="page">
    <h1>Hello Mapphub</h1>
    <p>Шаблон мини-приложения. На каждой странице подключайте <code>miniapps-bridge.js</code>.</p>
    <label class="field">
      Адрес LAN-сервера (если открыли PWA с Pages и хотите ходить на телефон-хост)
      <input id="server" type="url" placeholder="http://192.168.0.10:8790"/>
    </label>
    <button type="button" id="save">Сохранить</button>
    <pre id="log"></pre>
  </main>
  <script src="./miniapps-bridge.js"></script>
  <script src="./app.js"></script>
</body>
</html>
