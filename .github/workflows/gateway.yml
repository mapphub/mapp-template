name: Gateway publish
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reject PR from main/master work branch
        id: gate
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if [ "$HEAD_REF" = "main" ] || [ "$HEAD_REF" = "master" ]; then
            MSG=$(cat <<EOF
          ❌ PR из ветки **main/master** не принимается.

          1. Создайте ветку с **именем мини-приложения** (например \`todo\`)
          2. Укажите версию в \`package.json\`
          3. Откройте pull request **из этой ветки**

          Будет создан репозиторий \`mapphub/app-${AUTHOR}-<ветка>\`, id: \`${AUTHOR}.<ветка>\`.
          EOF
          )
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$MSG"
            echo "reject=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reject=false" >> "$GITHUB_OUTPUT"

      - name: Checkout template (trusted workflows)
        if: steps.gate.outputs.reject != 'true'
        uses: actions/checkout@v4
        with:
          path: _template
          ref: ${{ github.event.pull_request.base.sha }}
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Checkout PR head (app content)
        if: steps.gate.outputs.reject != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: _pr
          token: ${{ secrets.ORG_ADMIN_TOKEN }}

      - name: Resolve identity
        if: steps.gate.outputs.reject != 'true'
        id: meta
        run: |
          set -euo pipefail
          AUTHOR="${{ github.event.pull_request.user.login }}"
          RAW="${{ github.event.pull_request.head.ref }}"
          NAME=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-40)
          test -n "$NAME"
          test -f _pr/package.json
          VERSION=$(jq -r '.version // empty' _pr/package.json)
          test -n "$VERSION"
          REPO="app-${AUTHOR}-${NAME}"
          ID="${AUTHOR}.${NAME}"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Build publish payload
        if: steps.gate.outputs.reject != 'true'
        env:
          AUTHOR: ${{ steps.meta.outputs.author }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          APP_REPO: ${{ steps.meta.outputs.repo }}
          APP_ID: ${{ steps.meta.outputs.id }}
        run: |
          set -euo pipefail
          rm -rf /tmp/payload && mkdir -p /tmp/payload
          rsync -a --exclude '.git' --exclude '.github' _pr/ /tmp/payload/

          MAN=/tmp/payload/mapp/mapp.manifest.json
          mkdir -p /tmp/payload/mapp
          if [ ! -f "$MAN" ]; then
            echo '{"routes":{"root":"public","app":"public","client":"public","www":"public"}}' > "$MAN"
          fi
          MANIFEST_URL="https://raw.githubusercontent.com/mapphub/${APP_REPO}/main/mapp/mapp.manifest.json"
          PKG_URL="https://github.com/mapphub/${APP_REPO}/releases/latest/download/app.zip"
          jq --arg a "$AUTHOR" --arg n "$NAME" --arg v "$VERSION" --arg id "$APP_ID" \
             --arg mu "$MANIFEST_URL" --arg pu "$PKG_URL" --arg repo "https://github.com/mapphub/${APP_REPO}" \
            '.author=$a | .id=$id | .name=$n | .version=$v | .official=false
             | .update = {manifestUrl:$mu, packageUrl:$pu, repo:$repo}' \
            "$MAN" > /tmp/man.json
          mv /tmp/man.json "$MAN"
          cp "$MAN" /tmp/payload/mapp/mappmanifest.json

          mkdir -p /tmp/payload/.github/workflows
          TPL=_template/.github/workflows/app-gateway.template.yml
          test -f "$TPL"
          sed -e "s/__OWNER_LOGIN__/${AUTHOR}/g" \
              -e "s/__APP_NAME__/${NAME}/g" \
              -e "s/__APP_REPO__/${APP_REPO}/g" \
              -e "s/__APP_ID__/${APP_ID}/g" \
              "$TPL" > /tmp/payload/.github/workflows/app-gateway.yml

      - name: Create/update app repo + pages + GitHub releases + catalog only
        if: steps.gate.outputs.reject != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          AUTHOR: ${{ steps.meta.outputs.author }}
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          APP_REPO: ${{ steps.meta.outputs.repo }}
          APP_ID: ${{ steps.meta.outputs.id }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"

          if ! gh repo view "mapphub/${APP_REPO}" >/dev/null 2>&1; then
            gh repo create "mapphub/${APP_REPO}" --public \
              --description "Mini-app ${NAME} by ${AUTHOR}"
          fi

          rm -rf /tmp/app-repo
          if git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${APP_REPO}.git" /tmp/app-repo 2>/dev/null; then
            true
          else
            mkdir -p /tmp/app-repo && cd /tmp/app-repo && git init && git checkout -b main
          fi

          rsync -a --delete --exclude '.git' /tmp/payload/ /tmp/app-repo/

          cd /tmp/app-repo
          git config user.name "$AUTHOR"
          git config user.email "${AUTHOR}@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "release ${VERSION}"
          git push -u "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${APP_REPO}.git" HEAD:main

          WWW=$(jq -r '.routes.www // .routes.app // "public"' mapp/mapp.manifest.json)
          SRC="mapp/${WWW}"
          if [ -d "$SRC" ] && [ -f "$SRC/index.html" ]; then
            rm -rf /tmp/ghp && mkdir -p /tmp/ghp
            cp -a "$SRC"/. /tmp/ghp/
            cd /tmp/ghp
            git init && git checkout -b gh-pages
            git config user.name "$AUTHOR"
            git config user.email "${AUTHOR}@users.noreply.github.com"
            git add -A && git commit -m "pages ${VERSION}"
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/mapphub/${APP_REPO}.git" gh-pages
            gh api -X PUT "repos/mapphub/${APP_REPO}/pages" -f build_type=legacy -f source[branch]=gh-pages -f source[path]=/ 2>/dev/null || \
              gh api -X POST "repos/mapphub/${APP_REPO}/pages" -f build_type=legacy -f source[branch]=gh-pages -f source[path]=/ 2>/dev/null || true
          fi

          cd /tmp/app-repo
          (cd mapp && zip -r -q ../app.zip .)
          PREV_BODY=$(gh release view latest -R "mapphub/${APP_REPO}" --json body -q .body 2>/dev/null || echo "")
          PREV_VER=$(echo "$PREV_BODY" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          MAJOR_PREV=$(echo "$PREV_VER" | cut -d. -f1)
          MAJOR_NEW=$(echo "$VERSION" | cut -d. -f1)

          gh release delete latest -R "mapphub/${APP_REPO}" -y 2>/dev/null || true
          gh release create latest app.zip -R "mapphub/${APP_REPO}" \
            --title "${NAME} ${VERSION}" --notes "version ${VERSION}" --latest

          if [ -n "$PREV_VER" ] && [ "$MAJOR_NEW" != "$MAJOR_PREV" ]; then
            gh release create "v${VERSION}" app.zip -R "mapphub/${APP_REPO}" \
              --title "${NAME} v${VERSION} (major)" --notes "Major release ${VERSION}" 2>/dev/null || true
          elif echo "$VERSION" | grep -Eq '^[0-9]+\.0\.0$'; then
            gh release create "v${VERSION}" app.zip -R "mapphub/${APP_REPO}" \
              --title "${NAME} v${VERSION}" --notes "Major ${VERSION}" 2>/dev/null || true
          fi

          PKG_URL="https://github.com/mapphub/${APP_REPO}/releases/latest/download/app.zip"
          MANIFEST_URL="https://raw.githubusercontent.com/mapphub/${APP_REPO}/main/mapp/mapp.manifest.json"
          WEB_URL="https://mapphub.github.io/apps/$(echo "$APP_ID" | tr '.' '-')/"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          rm -rf /tmp/site
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/mapphub/mapphub.github.io.git" /tmp/site

          jq --arg id "$APP_ID" --arg name "$NAME" --arg ver "$VERSION" \
             --arg author "$AUTHOR" --arg repo "https://github.com/mapphub/${APP_REPO}" \
             --arg pkg "$PKG_URL" --arg mu "$MANIFEST_URL" --arg web "$WEB_URL" --arg now "$NOW" \
             '.updatedAt=$now | .apps=((.apps//[])|map(select(.id!=$id)))+[{id:$id,name:$name,version:$ver,description:"",author:$author,repo:$repo,packageUrl:$pkg,releaseUrl:$pkg,manifestUrl:$mu,webUrl:$web,official:false}]' \
             /tmp/site/catalog.json > /tmp/catalog.json
          mv /tmp/catalog.json /tmp/site/catalog.json

          cd /tmp/site
          git config user.name "$AUTHOR"
          git config user.email "${AUTHOR}@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "catalog: ${APP_ID}@${VERSION}"
          git push

          echo "OK mapphub/${APP_REPO} ${APP_ID}@${VERSION}"

      - name: Comment PR result
        if: always() && steps.gate.outputs.reject != 'true'
        env:
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          A="${{ steps.meta.outputs.author }}"
          V="${{ steps.meta.outputs.version }}"
          R="${{ steps.meta.outputs.repo }}"
          ID="${{ steps.meta.outputs.id }}"
          BODY="✅ **Gateway**

          | | |
          |---|---|
          | Репозиторий | https://github.com/mapphub/${R} |
          | id | \`${ID}\` |
          | version | \`${V}\` |
          | Пакет | https://github.com/mapphub/${R}/releases/latest/download/app.zip |
          | Манифест | https://raw.githubusercontent.com/mapphub/${R}/main/mapp/mapp.manifest.json |
          | Каталог | https://mapphub.github.io/catalog.json |

          Релизы только в репозитории приложения; на портале — catalog.json."
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "$BODY" || true
