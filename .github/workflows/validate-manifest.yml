name: Validate PR
on:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package.json and mapp layout
        run: |
          set -euo pipefail
          test -f package.json
          VER=$(jq -r '.version // empty' package.json)
          test -n "$VER"
          echo "package.json version=$VER"
          test -f mapp/mapp.manifest.json
          python3 - <<'PY'
          import json, re
          ver = json.load(open('package.json')).get('version') or ''
          if not re.match(r'^\d+\.\d+\.\d+', ver):
              raise SystemExit(f'version must be semver-like, got {ver!r}')
          m = json.load(open('mapp/mapp.manifest.json'))
          print('manifest ok', list(m.keys())[:12])
          PY
