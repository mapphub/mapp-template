name: Package mini-app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          MAN=mapp/mapp.manifest.json
          [ -f "$MAN" ] || MAN=mappmanifest.json
          test -f "$MAN"
          VER=$(jq -r '.version // empty' "$MAN")
          ID=$(jq -r '.id // "app"' "$MAN")
          test -n "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Skip if version already released
        id: skip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.ver.outputs.version }}"
          CUR=$(gh release view latest --json body,name,tagName -q '.body + " " + .name + " " + .tagName' 2>/dev/null || echo "")
          if [ "${{ github.event_name }}" = "push" ] && echo "$CUR" | grep -qF "$VER"; then
            echo "Version $VER already released — skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dist
        if: steps.skip.outputs.skip != 'true'
        run: |
          mkdir -p dist
          if [ -d mapp ]; then
            cp -a mapp/. dist/
          else
            cp -r index.html app.js style.css miniapps-bridge.js mappmanifest.json icon.svg dist/ 2>/dev/null || true
            if [ -d public ]; then cp -r public/* dist/; fi
          fi
          (cd dist && zip -r ../app.zip .)
          ls -lh app.zip

      - name: Release zip
        if: steps.skip.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.ver.outputs.id }} ${{ steps.ver.outputs.version }}
          body: |
            version ${{ steps.ver.outputs.version }}
            id ${{ steps.ver.outputs.id }}
          files: app.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect web flag
        if: steps.skip.outputs.skip != 'true'
        id: web
        run: |
          MAN=mapp/mapp.manifest.json
          [ -f "$MAN" ] || MAN=mappmanifest.json
          WEB=$(python3 -c "import json;print('true' if json.load(open('$MAN')).get('web') else 'false')" 2>/dev/null || echo false)
          echo "enabled=$WEB" >> $GITHUB_OUTPUT

      - if: steps.skip.outputs.skip != 'true' && steps.web.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.skip.outputs.skip != 'true' && steps.web.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - if: steps.skip.outputs.skip != 'true' && steps.web.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
